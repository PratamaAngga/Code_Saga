<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Saga – Register</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/login.css">

  <style>
    /* Register-specific overrides */
    .login-card {
      padding: 28px 40px 26px;
    }

    .card-title-register {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.95rem;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      transition: background .3s;
    }

    .step-dot.active {
      background: var(--red);
      box-shadow: 0 0 6px rgba(211,47,47,.5);
    }

    .step-line {
      flex: 1;
      max-width: 40px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    /* Password strength bar */
    .strength-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width .3s, background .3s;
    }
    .strength-label {
      font-size: .72rem;
      font-weight: 700;
      margin-top: 3px;
      min-height: 14px;
      color: var(--text-muted);
    }

    /* Alert box */
    .alert-box {
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      display: none;
    }
    .alert-error   { background:#FFEBEE; border:1.5px solid #EF9A9A; color:#C62828; }
    .alert-success { background:#E8F5E9; border:1.5px solid #A5D6A7; color:#2E7D32; }

    /* Submit button label */
    #submitLabel { pointer-events: none; }

    /* Confirm password match indicator */
    .match-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      display: none;
    }

    .login-card .signup-row {
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SCENE -->
  <div class="bg-scene"></div>

  <!-- LOGO -->
  <div class="site-logo">
    <img src="assets/images/logo.png" alt="Code Saga" height="60">
  </div>

  <!-- REGISTER CARD -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- STAR BADGE -->
      <div class="star-badge">
        <img src="assets/icons/star.png" class="star-badge" alt="star">
      </div>

      <!-- HEADING -->
      <h1 class="card-title-register">CREATE ACCOUNT</h1>
      <p class="card-subtitle">Join the adventure and start learning Java!</p>

      <!-- STEP INDICATOR -->
      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot4"></div>
      </div>

      <!-- ALERT BOX -->
      <div class="alert-box" id="alertBox"></div>

      <!-- FORM -->
      <form id="registerForm" novalidate>

        <!-- Username -->
        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" class="form-input"
            placeholder="Username" autocomplete="username" required/>
        </div>

        <!-- Email -->
        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" name="email" class="form-input"
            placeholder="Email" autocomplete="email" required/>
        </div>

        <!-- Password -->
        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" class="form-input"
            placeholder="Password" autocomplete="new-password" required/>
          <button type="button" class="icon-right" id="togglePassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <!-- Password strength -->
        <div class="strength-bar-wrap">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-label" id="strengthLabel"></div>

        <!-- Confirm Password -->
        <div class="input-group-custom" style="margin-top: 10px;">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
            placeholder="Confirm Password" autocomplete="new-password" required/>
          <span class="match-icon" id="matchIcon"></span>
        </div>

        <!-- REGISTER BUTTON -->
        <button type="submit" class="btn-login" id="submitBtn" style="margin-top: 16px;">
          <img src="assets/icons/console.png" alt="" width="22">
          <span id="submitLabel">Create Account</span>
        </button>

      </form>

      <!-- LOGIN LINK -->
      <div class="signup-row">
        Already have an account? <a href="login.html">Log in here</a>
      </div>

    </div>
  </div>

  <!-- BACK TO HOME -->
  <a href="index.html" class="btn-back-home">
    <span class="arrow-icon"><img src="assets/icons/arrow-login.png" width="18"></span>
    Back to Home
  </a>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase config -->
  <script src="js/config/supabase.js"></script>

  <script>
    /* ── Supabase init ── */
    const SUPABASE_URL  = 'https://ihwpxhqflghiblbfjonx.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlod3B4aHFmbGdoaWJsYmZqb254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzI3MTYsImV4cCI6MjA5Mjg0ODcxNn0.bk_CewautLlPWewjZCXQMKNY8zPF1wkPVZu-VNxOzpc';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    /* ── DOM refs ── */
    const form            = document.getElementById('registerForm');
    const submitBtn       = document.getElementById('submitBtn');
    const submitLabel     = document.getElementById('submitLabel');
    const alertBox        = document.getElementById('alertBox');
    const passwordInput   = document.getElementById('password');
    const confirmInput    = document.getElementById('confirmPassword');
    const strengthBar     = document.getElementById('strengthBar');
    const strengthLabel   = document.getElementById('strengthLabel');
    const matchIcon       = document.getElementById('matchIcon');
    const togglePwdBtn    = document.getElementById('togglePassword');
    const eyeIcon         = document.getElementById('eyeIcon');

    /* Step dots */
    const dots = [
      document.getElementById('dot1'),
      document.getElementById('dot2'),
      document.getElementById('dot3'),
      document.getElementById('dot4'),
    ];
    const fields = ['username', 'email', 'password', 'confirmPassword'];

    /* Activate step dots as user fills fields */
    fields.forEach((id, i) => {
      document.getElementById(id).addEventListener('input', () => {
        dots[i].classList.toggle('active', document.getElementById(id).value.length > 0);
      });
    });

    /* ── Alert helpers ── */
    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = 'block';
    }
    function hideAlert() {
      alertBox.style.display = 'none';
    }

    /* ── Toggle password visibility ── */
    togglePwdBtn.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    /* ── Password strength ── */
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const pct   = (score / 5) * 100;
      const color = score <= 1 ? '#EF5350' : score <= 3 ? '#FFA726' : '#66BB6A';
      const label = score <= 1 ? 'Weak' : score <= 3 ? 'Medium' : 'Strong';

      strengthBar.style.width      = pct + '%';
      strengthBar.style.background = color;
      strengthLabel.textContent    = val.length ? label : '';
      strengthLabel.style.color    = color;

      checkMatch();
    });

    /* ── Confirm password match ── */
    confirmInput.addEventListener('input', checkMatch);
    function checkMatch() {
      if (!confirmInput.value) { matchIcon.style.display = 'none'; return; }
      const match = passwordInput.value === confirmInput.value;
      matchIcon.style.display = 'block';
      matchIcon.textContent   = match ? '✅' : '❌';
    }

    /* ── Form submit ── */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirm  = confirmInput.value;

      /* Validasi */
      if (!username || !email || !password || !confirm) {
        showAlert('Semua field harus diisi.', 'error'); return;
      }
      if (username.length < 3) {
        showAlert('Username minimal 3 karakter.', 'error'); return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('Format email tidak valid.', 'error'); return;
      }
      if (password.length < 6) {
        showAlert('Password minimal 6 karakter.', 'error'); return;
      }
      if (password !== confirm) {
        showAlert('Password dan konfirmasi tidak cocok.', 'error'); return;
      }

      /* Loading state */
      submitBtn.disabled = true;
      submitLabel.textContent = 'Creating account…';

      try {
        /* 1. Daftarkan user ke Supabase Auth */
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: { username }
          }
        });

        if (error) throw error;

        /* 2. Simpan username ke tabel public.users */
        if (data.user) {
          await sb.from('users').upsert({
            id:       data.user.id,
            email:    email,
            username: username,
          });
        }

        /* 3. Berhasil */
        if (data.user?.identities?.length === 0) {
          showAlert('Email sudah terdaftar. Silakan login.', 'error');
        } else {
          showAlert('Akun berhasil dibuat! Selamat Datang, ' + username + '!', 'success');
          form.reset();
          strengthBar.style.width = '0%';
          strengthLabel.textContent = '';
          matchIcon.style.display = 'none';
          dots.forEach(d => d.classList.remove('active'));
          dots[0].classList.add('active');
          setTimeout(() => { window.location.href = 'login.html'; }, 3000);
        }

      } catch (err) {
        let msg = err.message;
        if (msg.includes('User already registered')) msg = 'Email sudah terdaftar. Silakan login.';
        if (msg.includes('Password should be'))      msg = 'Password minimal 6 karakter.';
        if (msg.includes('Unable to validate'))      msg = 'Format email tidak valid.';
        showAlert(msg, 'error');
      } finally {
        submitBtn.disabled = false;
        submitLabel.textContent = 'Create Account';
      }
    });

    /* ── Jika sudah login, redirect ── */
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'floor.html';
    })();
  </script>

</body>
</html>
