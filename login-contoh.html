<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Saga – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/login.css">
  <style>
    /* ── Register-only fields ── */
    .register-only { display: none; }

    /* ── Password strength ── */
    .strength-bar-wrap {
      height: 4px;
      background: var(--border, #e0e0e0);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width .3s, background .3s;
    }
    .strength-label {
      font-size: .72rem;
      font-weight: 700;
      margin-top: 3px;
      min-height: 14px;
      color: #aaa;
    }

    /* ── Match icon ── */
    .match-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      display: none;
    }

    /* ── Step dots (register) ── */
    .step-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .step-indicator.show { display: flex; }
    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--border, #e0e0e0);
      transition: background .3s;
    }
    .step-dot.active { background: var(--red, #d32f2f); box-shadow: 0 0 6px rgba(211,47,47,.5); }
    .step-line {
      flex: 1; max-width: 40px; height: 2px;
      background: var(--border, #e0e0e0); border-radius: 2px;
    }

    /* ── Alert box ── */
    .alert-box {
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      display: none;
    }
    .alert-error   { background:#FFEBEE; border:1.5px solid #EF9A9A; color:#C62828; }
    .alert-success { background:#E8F5E9; border:1.5px solid #A5D6A7; color:#2E7D32; }
    .alert-info    { background:#E3F2FD; border:1.5px solid #90CAF9; color:#1565C0; }

    /* ── Login-only extras (forgot password row) ── */
    .login-only { display: flex; }

    /* ── Transition animasi switch mode ── */
    .login-card { transition: min-height .3s ease; }
  </style>
</head>
<body>

  <div class="bg-scene"></div>

  <!-- LOGO -->
  <div class="site-logo">
    <img src="assets/images/logo.png" alt="Code Saga" height="60">
  </div>

  <!-- CARD -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- STAR BADGE -->
      <div class="star-badge">
        <img src="assets/icons/star.png" class="star-badge" alt="star">
      </div>

      <!-- HEADING -->
      <h1 class="card-title" id="formTitle">WELCOME BACK!</h1>
      <p class="card-subtitle" id="formSubtitle">Log in and continue your coding adventure</p>

      <!-- STEP DOTS (muncul saat register) -->
      <div class="step-indicator" id="stepIndicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-line"></div>
        <div class="step-dot" id="dot4"></div>
      </div>

      <!-- ALERT BOX -->
      <div class="alert-box" id="alertBox"></div>

      <!-- FORM -->
      <form id="authForm" novalidate>

        <!-- Username (register only) -->
        <div class="input-group-custom register-only" id="usernameField">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" class="form-input"
            placeholder="Username" autocomplete="username"/>
        </div>

        <!-- Email -->
        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" name="email" class="form-input"
            placeholder="Email" autocomplete="email" required/>
        </div>

        <!-- Password -->
        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" class="form-input"
            placeholder="Password" autocomplete="current-password" required/>
          <button type="button" class="icon-right" id="togglePassword" aria-label="Toggle password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <!-- Password strength (register only) -->
        <div class="register-only" id="strengthWrap">
          <div class="strength-bar-wrap">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <!-- Confirm password (register only) -->
        <div class="input-group-custom register-only" id="confirmField" style="margin-top:10px; position:relative;">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
            placeholder="Confirm Password" autocomplete="new-password"/>
          <span class="match-icon" id="matchIcon"></span>
        </div>

        <!-- Forgot password (login only) -->
        <div class="form-footer-row login-only" id="loginExtras">
          <span></span>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn-login" id="submitBtn">
          <img src="assets/icons/console.png" alt="" width="22">
          <span id="submitLabel">Login</span>
        </button>

        <!-- OR divider -->
        <div class="divider">or</div>

        <!-- GOOGLE -->
        <button type="button" class="btn-google" id="googleBtn">
          <svg class="google-g" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          <span id="googleLabel">Log in with Google</span>
        </button>

      </form>

      <!-- TOGGLE LOGIN / REGISTER -->
      <div class="signup-row">
        <span id="toggleText">Don't have an account?</span>
        <a href="#" id="toggleMode"> Sign up here</a>
      </div>

    </div>
  </div>

  <!-- BACK TO HOME -->
  <a href="index.html" class="btn-back-home">
    <span class="arrow-icon"><img src="assets/icons/arrow-login.png" width="18"></span>
    Back to Home
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ── Supabase init ──────────────────────────────────────
    const SUPABASE_URL  = 'https://ihwpxhqflghiblbfjonx.supabase.co'
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlod3B4aHFmbGdoaWJsYmZqb254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzI3MTYsImV4cCI6MjA5Mjg0ODcxNn0.bk_CewautLlPWewjZCXQMKNY8zPF1wkPVZu-VNxOzpc'
    const { createClient } = supabase
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON)

    // ── State ──────────────────────────────────────────────
    let isRegister = false

    // ── DOM refs ───────────────────────────────────────────
    const formTitle       = document.getElementById('formTitle')
    const formSubtitle    = document.getElementById('formSubtitle')
    const alertBox        = document.getElementById('alertBox')
    const submitBtn       = document.getElementById('submitBtn')
    const submitLabel     = document.getElementById('submitLabel')
    const toggleMode      = document.getElementById('toggleMode')
    const toggleText      = document.getElementById('toggleText')
    const stepIndicator   = document.getElementById('stepIndicator')
    const usernameField   = document.getElementById('usernameField')
    const strengthWrap    = document.getElementById('strengthWrap')
    const confirmField    = document.getElementById('confirmField')
    const loginExtras     = document.getElementById('loginExtras')
    const googleLabel     = document.getElementById('googleLabel')
    const passwordInput   = document.getElementById('password')
    const confirmInput    = document.getElementById('confirmPassword')
    const strengthBar     = document.getElementById('strengthBar')
    const strengthLabel   = document.getElementById('strengthLabel')
    const matchIcon       = document.getElementById('matchIcon')
    const eyeIcon         = document.getElementById('eyeIcon')
    const dots            = [
      document.getElementById('dot1'),
      document.getElementById('dot2'),
      document.getElementById('dot3'),
      document.getElementById('dot4'),
    ]

    // ── Alert helpers ──────────────────────────────────────
    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg
      alertBox.className = `alert-box alert-${type}`
      alertBox.style.display = 'block'
    }
    function hideAlert() {
      alertBox.style.display = 'none'
      alertBox.textContent = ''
    }

    // ── Loading state ──────────────────────────────────────
    function setLoading(on) {
      submitBtn.disabled = on
      submitBtn.style.opacity = on ? '0.7' : '1'
      submitLabel.textContent = on
        ? (isRegister ? 'Creating account…' : 'Logging in…')
        : (isRegister ? 'Create Account' : 'Login')
    }

    // ── Switch mode LOGIN <-> REGISTER ─────────────────────
    function switchMode(toRegister) {
      isRegister = toRegister
      hideAlert()

      // Reset form
      document.getElementById('authForm').reset()
      strengthBar.style.width = '0%'
      strengthLabel.textContent = ''
      matchIcon.style.display = 'none'
      dots.forEach((d, i) => d.classList.toggle('active', i === 0))

      if (isRegister) {
        formTitle.textContent    = 'CREATE ACCOUNT'
        formSubtitle.textContent = 'Join the adventure and start learning Java!'
        submitLabel.textContent  = 'Create Account'
        toggleText.textContent   = 'Already have an account?'
        toggleMode.textContent   = ' Log in here'
        googleLabel.textContent  = 'Sign up with Google'

        // Tampilkan register fields
        usernameField.style.display  = 'block'
        strengthWrap.style.display   = 'block'
        confirmField.style.display   = 'block'
        stepIndicator.classList.add('show')
        loginExtras.style.display    = 'none'

        // Wajibkan field register
        document.getElementById('username').required        = true
        document.getElementById('confirmPassword').required = true
      } else {
        formTitle.textContent    = 'WELCOME BACK!'
        formSubtitle.textContent = 'Log in and continue your coding adventure'
        submitLabel.textContent  = 'Login'
        toggleText.textContent   = "Don't have an account?"
        toggleMode.textContent   = ' Sign up here'
        googleLabel.textContent  = 'Log in with Google'

        // Sembunyikan register fields
        usernameField.style.display  = 'none'
        strengthWrap.style.display   = 'none'
        confirmField.style.display   = 'none'
        stepIndicator.classList.remove('show')
        loginExtras.style.display    = 'flex'

        // Hapus required field register
        document.getElementById('username').required        = false
        document.getElementById('confirmPassword').required = false
      }
    }

    toggleMode.addEventListener('click', e => {
      e.preventDefault()
      switchMode(!isRegister)
    })

    // ── Toggle password visibility ─────────────────────────
    document.getElementById('togglePassword').addEventListener('click', () => {
      const show = passwordInput.type === 'password'
      passwordInput.type = show ? 'text' : 'password'
      eyeIcon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
    })

    // ── Password strength ──────────────────────────────────
    passwordInput.addEventListener('input', () => {
      if (!isRegister) return
      const val = passwordInput.value
      let score = 0
      if (val.length >= 6)           score++
      if (val.length >= 10)          score++
      if (/[A-Z]/.test(val))         score++
      if (/[0-9]/.test(val))         score++
      if (/[^A-Za-z0-9]/.test(val))  score++

      const pct   = (score / 5) * 100
      const color = score <= 1 ? '#EF5350' : score <= 3 ? '#FFA726' : '#66BB6A'
      const label = score <= 1 ? 'Weak' : score <= 3 ? 'Medium' : 'Strong'

      strengthBar.style.width      = pct + '%'
      strengthBar.style.background = color
      strengthLabel.textContent    = val.length ? label : ''
      strengthLabel.style.color    = color

      // Update step dot password
      dots[2].classList.toggle('active', val.length > 0)
      checkMatch()
    })

    // ── Confirm password match ─────────────────────────────
    confirmInput.addEventListener('input', checkMatch)
    function checkMatch() {
      if (!confirmInput.value) { matchIcon.style.display = 'none'; return }
      const match = passwordInput.value === confirmInput.value
      matchIcon.style.display = 'block'
      matchIcon.textContent   = match ? '✅' : '❌'
      dots[3].classList.toggle('active', match)
    }

    // ── Step dots live update ──────────────────────────────
    ;['username', 'email', 'password'].forEach((id, i) => {
      document.getElementById(id).addEventListener('input', () => {
        if (!isRegister) return
        dots[i].classList.toggle('active', document.getElementById(id).value.length > 0)
      })
    })

    // ── Forgot password ────────────────────────────────────
    document.getElementById('forgotLink').addEventListener('click', async e => {
      e.preventDefault()
      const email = document.getElementById('email').value.trim()
      if (!email) {
        showAlert('Masukkan email kamu dulu, lalu klik Forgot Password.', 'info')
        return
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/index.html'
      })
      if (error) showAlert('Gagal kirim email reset: ' + error.message, 'error')
      else showAlert('Email reset password sudah dikirim! Cek inbox kamu.', 'success')
    })

    // ── Helper: sync user ke tabel public.users ────────────
    async function syncUserToPublicTable(authUser, username = null) {
      // Cek dulu apakah sudah ada di tabel users
      const { data: existing } = await sb
        .from('users')
        .select('id')
        .eq('id', authUser.id)
        .single()

      if (existing) return // sudah ada, skip

      // Belum ada, insert baru
      const { error } = await sb.from('users').insert({
        id:           authUser.id,
        email:        authUser.email,
        username:     username
                        || authUser.user_metadata?.username
                        || authUser.user_metadata?.full_name
                        || authUser.email.split('@')[0], // fallback: bagian depan email
        total_xp:     0,
        level:        1,
        streak_days:  0,
        current_path: 'main',
        last_active:  new Date().toISOString().split('T')[0]
      })

      if (error) console.error('Gagal sync user ke public.users:', error.message)
    }

    // ── Main form submit ───────────────────────────────────
    document.getElementById('authForm').addEventListener('submit', async e => {
      e.preventDefault()
      hideAlert()

      const email    = document.getElementById('email').value.trim()
      const password = passwordInput.value
      const username = document.getElementById('username').value.trim()
      const confirm  = confirmInput.value

      // Validasi
      if (!email || !password) {
        showAlert('Email dan password tidak boleh kosong.', 'error'); return
      }
      if (isRegister) {
        if (!username)           { showAlert('Username tidak boleh kosong.', 'error'); return }
        if (username.length < 3) { showAlert('Username minimal 3 karakter.', 'error'); return }
        if (password.length < 6) { showAlert('Password minimal 6 karakter.', 'error'); return }
        if (password !== confirm) { showAlert('Password dan konfirmasi tidak cocok.', 'error'); return }
      }

      setLoading(true)

      try {
        if (isRegister) {
          // ── REGISTER ─────────────────────────────────────
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { username } }
          })

          if (error) throw error

          // Email sudah terdaftar
          if (data.user?.identities?.length === 0) {
            showAlert('Email sudah terdaftar. Silakan login.', 'error')
            setLoading(false)
            return
          }

          // Sync ke tabel public.users
          if (data.user) {
            await syncUserToPublicTable(data.user, username)
          }

          showAlert('Akun berhasil dibuat! Selamat datang, ' + username + '! Mengalihkan ke login…', 'success')
          setTimeout(() => switchMode(false), 2500)

        } else {
          // ── LOGIN ─────────────────────────────────────────
          const { data, error } = await sb.auth.signInWithPassword({ email, password })
          if (error) throw error

          // Pastikan data user ada di tabel public.users
          // (jaga-jaga kalau dulu register via Google dan baru sekarang login manual)
          await syncUserToPublicTable(data.user)

          window.location.href = 'index.html'
        }

      } catch (err) {
        let msg = err.message
        if (msg.includes('Invalid login credentials'))  msg = 'Email atau password salah.'
        if (msg.includes('Email not confirmed'))         msg = 'Email belum dikonfirmasi. Cek inbox kamu.'
        if (msg.includes('User already registered'))     msg = 'Email sudah terdaftar. Silakan login.'
        if (msg.includes('Password should be'))          msg = 'Password minimal 6 karakter.'
        if (msg.includes('Unable to validate'))          msg = 'Format email tidak valid.'
        showAlert(msg, 'error')
      } finally {
        setLoading(false)
      }
    })

    // ── Google OAuth ───────────────────────────────────────
    document.getElementById('googleBtn').addEventListener('click', async () => {
      const googleBtn = document.getElementById('googleBtn')
      googleBtn.disabled = true
      googleBtn.style.opacity = '0.7'

      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/index.html' }
      })

      if (error) {
        showAlert('Google login gagal: ' + error.message, 'error')
        googleBtn.disabled = false
        googleBtn.style.opacity = '1'
      }
      // Kalau sukses, browser otomatis redirect ke Google
      // Supabase akan handle callback dan redirect ke index.html
      // Di index.html, onAuthStateChange akan trigger syncUserToPublicTable
    })

    // ── Handle Google OAuth callback + sync ───────────────
    // Ini jalan saat user balik dari redirect Google
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        // Kalau masuk via Google, sync ke public.users
        if (session.user.app_metadata?.provider === 'google') {
          await syncUserToPublicTable(session.user)
        }
      }
    })

    // ── Auto-redirect kalau sudah login ───────────────────
    ;(async () => {
      const { data: { session } } = await sb.auth.getSession()
      if (session) window.location.href = 'index.html'
    })()
  </script>

</body>
</html>
