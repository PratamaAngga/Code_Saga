<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Saga</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: url('assets/images/bg-floor.png') center/cover no-repeat;
      background-color: #2d5a1b;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(5,20,2,.5);
      pointer-events: none;
    }
    .splash {
      position: relative; z-index: 1;
      text-align: center;
      animation: fadeIn .4s ease both;
    }
    .splash img { height: 70px; margin-bottom: 24px; display: block; margin-left: auto; margin-right: auto; }
    /* fallback jika logo belum ada */
    .splash-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.2rem; color: #FFC107;
      text-shadow: 2px 2px 0 #3E2723;
      margin-bottom: 24px;
    }
    .dots { display: flex; justify-content: center; gap: 8px; }
    .dot {
      width: 12px; height: 12px;
      background: #FFC107; border-radius: 50%;
      animation: bounce .8s ease infinite;
    }
    .dot:nth-child(2) { animation-delay:.18s; }
    .dot:nth-child(3) { animation-delay:.36s; }
    @keyframes bounce {
      0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}
    }
    @keyframes fadeIn {
      from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)}
    }
  </style>
</head>
<body>
  <div class="splash">
    <!-- Coba tampilkan logo, fallback ke teks -->
    <img src="assets/images/logo.png" alt="Code Saga"
         onerror="this.style.display='none'; document.querySelector('.splash-text').style.display='block'">
    <div class="splash-text" style="display:none;">Code Saga</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/supabase.js"></script>
  <script>
    /**
     * index.html — REDIRECT HUB
     * Belum login  → landingGuest.html
     * Sudah login  → floor.html
     *
     * Semua halaman protected redirect ke sini jika session hilang
     * (via auth.guard.js yang menyimpan cs_after_login di sessionStorage)
     */
    (async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();

        if (session) {
          // Cek apakah ada halaman yang ingin dikunjungi sebelumnya
          const savedUrl = sessionStorage.getItem('cs_after_login');
          sessionStorage.removeItem('cs_after_login');

          if (savedUrl && !savedUrl.includes('login.html') && !savedUrl.includes('index.html')) {
            window.location.replace(savedUrl);
          } else {
            window.location.replace('floor.html');
          }
        } else {
          window.location.replace('landingGuest.html');
        }
      } catch (err) {
        console.error('index redirect error:', err);
        window.location.replace('landingGuest.html');
      }
    })();
  </script>
</body>
</html>
