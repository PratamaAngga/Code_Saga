<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Saga – Login</title>
  
  <!-- CSS Links -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="bg-scene"></div>

  <div class="site-logo">
    <img src="assets/images/logo.png" alt="Code Saga" height="60">
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="star-badge">
        <img src="assets/icons/star.png" alt="Star">
      </div>

      <h1 class="card-title" id="formTitle">WELCOME BACK!</h1>
      <p class="card-subtitle" id="formSubtitle">Log in and continue your coding adventure</p>

      <div id="alertBox" class="alert-box"></div>

      <form id="authForm" novalidate>
        <!-- Username (Hidden di mode login) -->
        <div class="input-group-custom" id="usernameField" style="display: none;">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" class="form-input" placeholder="Username" autocomplete="username"/>
        </div>

        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" name="email" class="form-input" placeholder="Email" autocomplete="email" required/>
        </div>

        <div class="input-group-custom">
          <span class="icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" class="form-input" placeholder="Password" autocomplete="current-password" required/>
          <button type="button" class="icon-right" id="togglePassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="form-footer-row" id="loginExtras">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" name="rememberMe"/> Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <img src="assets/icons/console.png" alt="" width="22">
          <span id="submitLabel">Login</span>
        </button>

        <div class="divider">or</div>

        <button type="button" class="btn-google" id="googleBtn">
          <svg class="google-g" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Log in with google
        </button>
      </form>

      <div class="signup-row">
        <span id="toggleText">Don't have an account?</span> <a href="#" id="toggleMode">Sign up here</a>
      </div>
    </div>
  </div>

  <a href="index.html" class="btn-back-home">
    <span class="arrow-icon"><img src="assets/icons/arrow-login.png" width="18" alt="Back"></span> Back to Home
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Panggil HANYA SATU file JS -->
  <script src="js/pages/login.js"></script>
</body>
</html>
