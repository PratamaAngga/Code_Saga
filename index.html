<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Saga</title>

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        url('assets/images/bg-floor.png')
        center / cover
        no-repeat;

      background-color: #2d5a1b;

      overflow: hidden;
    }

    body::before {
      content: '';

      position: fixed;
      inset: 0;

      background: rgba(5, 20, 2, 0.5);

      pointer-events: none;
    }

    .splash {
      position: relative;
      z-index: 2;

      text-align: center;

      animation: fadeIn 0.4s ease both;
    }

    .splash img {
      height: 80px;

      margin-bottom: 30px;

      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .splash-text {
      display: none;

      font-family: 'Press Start 2P', monospace;
      font-size: 1.3rem;

      color: #ffc107;

      text-shadow: 3px 3px 0 #3e2723;

      margin-bottom: 30px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .dot {
      width: 14px;
      height: 14px;

      background: #ffc107;

      border-radius: 50%;

      animation: bounce 0.8s ease infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.18s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="splash">

    <!-- Logo -->
    <img
      src="assets/images/logo.png"
      alt="Code Saga"

      onerror="
        this.style.display='none';
        document.querySelector('.splash-text').style.display='block';
      "
    />

    <!-- fallback text -->
    <div class="splash-text">
      Code Saga
    </div>

    <!-- loading -->
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SUPABASE CONFIG -->
  <script src="js/config/supabase.js"></script>

  <script>

    /**
     * INDEX REDIRECT
     * -------------------------
     * Sudah login  -> landingUser.html
     * Belum login  -> landingGuest.html
     */

    async function checkSession() {

      try {

        const {
          data: { session },
          error
        } = await sb.auth.getSession();

        if (error) {
          throw error;
        }

        // delay kecil supaya splash terlihat
        setTimeout(() => {

          if (session) {

            // kalau sebelumnya ada halaman tujuan
            const savedUrl =
              sessionStorage.getItem('cs_after_login');

            sessionStorage.removeItem('cs_after_login');

            if (
              savedUrl &&
              !savedUrl.includes('login.html') &&
              !savedUrl.includes('index.html')
            ) {

              window.location.href = savedUrl;

            } else {

              // user sudah login
              window.location.href = 'landingUser.html';

            }

          } else {

            // user belum login
            window.location.href = 'landingGuest.html';

          }

        }, 1200);

      } catch (err) {

        console.error(
          'Session check failed:',
          err
        );

        // fallback
        window.location.href = 'landingGuest.html';

      }

    }

    checkSession();

  </script>

</body>
</html>
